<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tibud Raffle System</title>
  <link rel="stylesheet" href="tibud.css">
</head>
<body>
  <img src="sample.jpg" alt="bg" class="bg">
  <img src="33rd_logo.png" alt="Logo" class="Logo">

  <div> 
    <a href="SavedNames.html">
      <button class="list">
        <img src="list.png" alt="View List">
      </button>
      <button class="reset-button" onclick="resetRaffle()">
        <img src="delete.png" alt="Reset Raffle">
      </button>
    </a>
  </div>

  <div class="raffle-world" id="world"></div>

  <div class="controls-wrapper">
    <button id="spin-button" onclick="spinAll()">
  <span class="btn-text">SPIN</span>
  <img src="Loading_icon.gif" class="btn-video" alt="loading">
</button>
    <div class="setup-controls">
      <label>Containers: </label>
      <select id="laneCount" onchange="initWorld()">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select> 
    </div> 
  </div>

  <canvas id="confetti-canvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
